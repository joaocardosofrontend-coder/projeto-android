<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>midia HTML</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>tente abrir site em varios dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width: 750)" srcset="imagens-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens-m.png" type="image/png">
        <img src="imagens-g.png" alt="imagem flexivel">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vomos aprender a reproduzir áudio em HTML5</p>
    <audio src="midia/Kuntry Boy - Anno Domini Beats.mp3" controls autoplay></audio>
    <audio preload="metadata" autoplay controls loop>
     <source src="midia/Cutscene Crush - Blue Deer Studio.mp3" type="audio/mpeg"> 
     <source src="midia/Cutscene Crush - Blue Deer Studio.mp3" type="audio/ogg"> 
     <source src="midia/Cutscene Crush - Blue Deer Studio.mp3" type="audio/wav">
     <p>infelismente seu navegador nao conserque reproduzir audio <a href="midia/Cutscene Crush - Blue Deer Studio.mp3" download>clique aqui para abaixa o arquivo MP3</a></p>
    </audio>
</body>
</html>

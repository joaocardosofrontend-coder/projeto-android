<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos com HTML5</title>
</head>
<body>
    <h1>inserido videos hospedados locamente</h1>
    <p>esse video esta ospedado no meu servidor</p>
    <video  width="400" poster="imagens/fluxo tech.png" controls autoplay loop>
        <source src="midia/meu-video.mp4.mp4" type="video/mp4">
        <p>seu navegador não suporta a reprodução deste video.</p>
    </video>
    <h1>inserindo videos do YuoTube</h1>
    <iframe width="400" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=wmiVPJ_44la6JU26" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'The Punk Grandmother Simple';
            src: url(fontes/The\ Punk\ Grandmother.otf) format('opentype'), url(fontes/The\ Punk\ Grandmother.otf) format('truetype');
            font-weight: normal;
            font-style: normal;
            /*tipos de forma
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg*/
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'The Punk Grandmother' Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Titulos</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque explicabo, natus quaerat inventore voluptatem veritatis autem hic architecto delectus itaque, eveniet quis omnis, nemo facere. Sunt assumenda dolorum hic dolore?</p>
</body>
</html>
